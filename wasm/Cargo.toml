[package]
name = "aha-wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1"

[build-dependencies]
serde_json = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
quote = "1"
proc-macro2 = "1"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
